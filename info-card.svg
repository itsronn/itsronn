  <!-- text body -->
  <rect x="14" y="56" width="492" height="278" fill="#1e1e1e" stroke="#3a3a3a"/>

  <g font-family="'Cascadia Code', 'Courier New', monospace" font-size="14">
    <text x="26" y="80" fill="#6a9955">&lt;card&gt;</text>

    <text x="44" y="104" fill="#6a9955">&lt;name&gt;</text>
    <text x="140" y="104" fill="#d4d4d4">ron</text>

    <text x="44" y="128" fill="#6a9955">&lt;title&gt;</text>
    <text x="140" y="128" fill="#d4d4d4">cs undergrad</text>

    <text x="44" y="152" fill="#6a9955">&lt;about&gt;</text>
    <text x="60" y="176" fill="#d4d4d4">hey there! i'm ron, an ai &amp; ds undergrad fuelled</text>
    <text x="60" y="198" fill="#d4d4d4">by curiosity and sleepless nights. by day, i</text>
    <text x="60" y="220" fill="#d4d4d4">pretend to understand the universe. by night, i</text>
    <text x="60" y="242" fill="#d4d4d4">write code to automate myself out of doing actual</text>
