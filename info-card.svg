<svg xmlns="http://www.w3.org/2000/svg" width="520" height="350" viewBox="0 0 520 350" font-family="Tahoma, Verdana, sans-serif">
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8cf0"/>
      <stop offset="0.45" stop-color="#1c4fc4"/>
      <stop offset="0.55" stop-color="#1e4fce"/>
      <stop offset="1" stop-color="#0f38ad"/>
    </linearGradient>
  </defs>

  <!-- window frame -->
  <rect x="10" y="10" width="500" height="330" fill="#ece9d8" stroke="#0831d9" stroke-width="1"/>

  <!-- title bar -->
  <rect x="10" y="10" width="500" height="24" fill="url(#titlebar)"/>
  <rect x="18" y="17" width="12" height="12" rx="2" fill="#ffffff"/>
  <text x="36" y="27" fill="#ffffff" font-size="13" font-weight="700">about_me.txt - Notepad</text>

  <!-- title bar buttons -->
  <rect x="452" y="16" width="16" height="14" fill="#d6d2c2" stroke="#7a7a7a"/>
  <text x="460" y="27" fill="#000" font-size="10" text-anchor="middle">_</text>
  <rect x="470" y="16" width="16" height="14" fill="#d6d2c2" stroke="#7a7a7a"/>
  <text x="478" y="27" fill="#000" font-size="10" text-anchor="middle">&#9633;</text>
  <rect x="488" y="16" width="16" height="14" fill="#d6d2c2" stroke="#7a7a7a"/>
  <text x="496" y="27" fill="#000" font-size="10" text-anchor="middle">&#10005;</text>

  <!-- menu bar -->
  <rect x="10" y="34" width="500" height="18" fill="#ece9d8"/>
  <line x1="10" y1="52" x2="510" y2="52" stroke="#b8b4a4"/>
  <text x="16" y="46" fill="#000" font-size="11">File   Edit   Format   View   Help</text>

  <!-- text body -->
  <rect x="14" y="56" width="492" height="278" fill="#ffffff" stroke="#7f9db9"/>

  <g font-family="'Courier New', monospace" font-size="14">
    <text x="26" y="80" fill="#2c8a2c">&lt;card&gt;</text>

    <text x="44" y="104" fill="#2c8a2c">&lt;name&gt;</text>
    <text x="140" y="104" fill="#000">ron</text>

    <text x="44" y="128" fill="#2c8a2c">&lt;title&gt;</text>
    <text x="140" y="128" fill="#000">cs undergrad</text>

    <text x="44" y="152" fill="#2c8a2c">&lt;about&gt;</text>
    <text x="60" y="176" fill="#000">hey there! i'm ron, an ai &amp; ds undergrad fuelled</text>
    <text x="60" y="198" fill="#000">by curiosity and sleepless nights. by day, i</text>
    <text x="60" y="220" fill="#000">pretend to understand the universe. by night, i</text>
    <text x="60" y="242" fill="#000">write code to automate myself out of doing actual</text>
    <text x="60" y="264" fill="#000">work.</text>
    <text x="44" y="288" fill="#2c8a2c">&lt;/about&gt;</text>

    <text x="26" y="312" fill="#2c8a2c">&lt;/card&gt;</text>
  </g>
</svg>
