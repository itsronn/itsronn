<svg xmlns="http://www.w3.org/2000/svg" width="520" height="350" viewBox="0 0 520 350" font-family="Segoe UI, Tahoma, Verdana, sans-serif">

  <!-- window frame -->
  <rect x="10" y="10" width="500" height="330" fill="#202020" stroke="#3a3a3a" stroke-width="1"/>

  <!-- title bar -->
  <rect x="10" y="10" width="500" height="24" fill="#2b2b2b"/>
  <rect x="18" y="17" width="12" height="12" rx="2" fill="#4fc1e9"/>
  <text x="36" y="27" fill="#e6e6e6" font-size="13" font-weight="500">about_me.txt - Notepad</text>

  <!-- title bar buttons -->
